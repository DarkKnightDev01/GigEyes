[package]
name = "gigeyes"
version.workspace = true
edition.workspace = true

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
json5 = "1.3.7"
realfft = "3.5.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "mkv"] }
ureq = { version = "3.5.1", features = ["json"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_System_SystemInformation", "Win32_Foundation"] }
