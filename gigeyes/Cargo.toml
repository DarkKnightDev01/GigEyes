[package]
name = "gigeyes"
version.workspace = true
edition.workspace = true

[dependencies]
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg"] }
json5 = "1.3.7"
libloading = "0.9.0"
realfft = "3.5.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "flac", "aac", "isomp4", "ogg", "vorbis", "mkv"] }
ureq = { version = "3.5.1", features = ["json"] }
vst3 = "0.3.0"

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6.2"
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
winresource = "0.1.34"
