name: Windows build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a pre-release with this tag, e.g. v0.1.0-prealpha.1 (leave empty to just build)"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v6
        with:
          name: gigeyes-windows
          path: |
            target/release/gigeyes.exe
            target/release/gp-probe.exe
      # Publish a pre-release: run this workflow by hand with a tag, or push to main with a
      # commit message starting "release: v0.1.0-prealpha.1".
      - if: inputs.release != '' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { ($env:MSG -split "`n")[0].Substring(8).Trim() }
          gh release create $tag target/release/gigeyes.exe target/release/gp-probe.exe `
            --target $env:GITHUB_SHA --prerelease --title "GigEyes $tag (pre-alpha)" `
            --notes-file .github/release-notes.md
        env:
          INPUT_TAG: ${{ inputs.release }}
          MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
