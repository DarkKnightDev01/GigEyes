name: Windows build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a pre-release with this tag, e.g. v0.1.0-prealpha.1 (leave empty to just build)"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v6
        with:
          name: gigeyes-windows
          path: |
            target/release/gigeyes.exe
            target/release/gp-probe.exe
      # Run this workflow by hand with a tag to publish the exes as a pre-release.
      - if: inputs.release != ''
        run: >-
          gh release create "$env:TAG" target/release/gigeyes.exe target/release/gp-probe.exe
          --target "${{ github.sha }}" --prerelease --title "GigEyes $env:TAG (pre-alpha)"
          --notes-file .github/release-notes.md
        env:
          TAG: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
