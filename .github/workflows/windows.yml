name: Windows build

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a pre-release with this tag, e.g. v0.1.0-prealpha.1 (leave empty to just build)"
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # Link support: ship yt-dlp.exe next to gigeyes.exe, only if it matches yt-dlp's published checksum.
      - name: Fetch yt-dlp
        run: |
          $base = "https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile target/release/yt-dlp.exe
          Invoke-WebRequest "$base/SHA2-256SUMS" -OutFile yt-dlp-sums.txt
          $line = Get-Content yt-dlp-sums.txt | Where-Object { $_ -match ' yt-dlp\.exe$' }
          $want = ($line -split ' ')[0]
          $got = (Get-FileHash target/release/yt-dlp.exe -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $got -ne $want) { throw "yt-dlp.exe checksum mismatch: got $got, expected $want" }
      # One file: the setup program with the app and yt-dlp appended (see gigeyes-setup/src/payload.rs).
      # Setup is a windowed program, so Start-Process -Wait is how PowerShell waits for it and reads its exit code.
      - name: Pack the installer
        run: |
          # Into its own folder: Windows file names ignore case, so target/release/GigEyes-Setup.exe
          # would be the running gigeyes-setup.exe itself.
          New-Item -ItemType Directory -Force dist | Out-Null
          $p = Start-Process target/release/gigeyes-setup.exe -Wait -PassThru -RedirectStandardError pack-errors.txt -ArgumentList `
            '--pack', 'dist/GigEyes-Setup.exe', 'target/release/gigeyes.exe', 'target/release/yt-dlp.exe'
          if ($p.ExitCode -ne 0) { Get-Content pack-errors.txt; throw "packing the installer failed ($($p.ExitCode))" }
          Get-Item dist/GigEyes-Setup.exe | Select-Object Name, Length
      # An update must leave exactly one GigEyes: from the per-user 0.4.0.1, through the newest
      # published release, to this build, then a clean uninstall.
      - name: Update over older versions on this Windows machine
        run: |
          $want = (Select-String 'pub const VERSION: &str = "(.+)";' gigeyes/src/look.rs).Matches[0].Groups[1].Value
          $newest = gh api "repos/$env:GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft | not)][0].tag_name'
          New-Item -ItemType Directory -Force old | Out-Null
          foreach ($tag in 'v0.4.0.1', $newest) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern 'GigEyes-Setup-*.exe' --dir "old\$tag"
          }
          function Run-Setup($exe, $what) {
            $p = Start-Process $exe -Wait -PassThru -RedirectStandardError "$env:RUNNER_TEMP\setup-errors.txt" -ArgumentList '--silent'
            if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-errors.txt"; throw "$what failed" }
          }
          $machine = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GigEyes"
          $user = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GigEyes"
          $perUser = "$env:LOCALAPPDATA\Programs\GigEyes"
          $dir = "$env:ProgramFiles\GigEyes"

          Run-Setup (Get-ChildItem old\v0.4.0.1\*.exe).FullName "installing 0.4.0.1"
          if (-not (Test-Path "$perUser\gigeyes.exe")) { throw "0.4.0.1 didn't install per user" }
          Run-Setup (Get-ChildItem "old\$newest\*.exe").FullName "updating to $newest"
          Run-Setup dist/GigEyes-Setup.exe "updating to this build ($want)"

          if (Test-Path $user) { throw "the per-user Installed apps entry from 0.4.0.1 is still there" }
          if (Test-Path $perUser) { throw "the per-user copy from 0.4.0.1 is still there: $(Get-ChildItem $perUser -Name)" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\GigEyes.lnk") { throw "the per-user Start menu shortcut is still there" }
          $entries = @(Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq 'GigEyes' })
          if ($entries.Count -ne 1) { throw "Installed apps lists GigEyes $($entries.Count) times" }
          $listed = (Get-ItemProperty $machine).DisplayVersion
          if ($listed -ne $want) { throw "Installed apps says $listed, expected $want" }
          $exe = (Get-Item "$dir\gigeyes.exe").VersionInfo.ProductVersion
          if ($exe -ne $want) { throw "gigeyes.exe is $exe, expected $want" }
          $files = (Get-ChildItem $dir -Name | Sort-Object) -join ','
          if ($files -ne 'gigeyes.exe,uninstall.exe,yt-dlp.exe') { throw "unexpected files in $dir`: $files" }
          "Updated from 0.4.0.1 through $newest to $want, one copy left."

          $u = Start-Process "$dir\uninstall.exe" -Wait -PassThru -ArgumentList '--uninstall', '--silent'
          if ($u.ExitCode -ne 0) { throw "uninstall after the update failed" }
          Start-Sleep -Seconds 6
          if ((Test-Path $dir) -or (Test-Path $machine)) { throw "uninstall after the update left GigEyes behind" }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install and uninstall on this Windows machine
        run: |
          $dir = "$env:RUNNER_TEMP\InstallTest"
          # Machine-wide since 0.4.1: Installed apps for everyone, shared Start menu. (The runner is an administrator.)
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GigEyes"
          $link = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\GigEyes.lnk"
          $p = Start-Process dist/GigEyes-Setup.exe -Wait -PassThru -RedirectStandardError install-errors.txt -ArgumentList '--silent', '--dir', $dir
          if ($p.ExitCode -ne 0) { Get-Content install-errors.txt; throw "install failed" }
          foreach ($f in 'gigeyes.exe', 'yt-dlp.exe', 'uninstall.exe') {
            if (-not (Test-Path "$dir\GigEyes\$f")) { throw "install is missing $f" }
          }
          if (-not (Test-Path $key)) { throw "not listed in Installed apps" }
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }
          (Get-ItemProperty $key) | Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString | Format-List
          # Started from inside the install folder, the way Installed apps may launch it.
          $u = Start-Process "$dir\GigEyes\uninstall.exe" -WorkingDirectory "$dir\GigEyes" -Wait -PassThru -RedirectStandardError "$env:RUNNER_TEMP\uninstall-errors.txt" -ArgumentList '--uninstall', '--silent'
          if ($u.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall-errors.txt"; throw "uninstall failed" }
          Start-Sleep -Seconds 6  # the uninstaller removes itself a moment after it exits
          if (Test-Path "$dir\GigEyes") { throw "install folder left behind: $(Get-ChildItem "$dir\GigEyes" -Name)" }
          if (Test-Path $key) { throw "still listed in Installed apps" }
          if (Test-Path $link) { throw "Start menu shortcut left behind" }
          "Install and uninstall both clean."
      - uses: actions/upload-artifact@v6
        with:
          name: gigeyes-windows
          path: |
            dist/GigEyes-Setup.exe
            target/release/gigeyes.exe
      # Publish a pre-release: run this workflow by hand with a tag, or push to main with a
      # commit message starting "release: v0.1.0-prealpha.1".
      - if: inputs.release != '' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:'))
        run: |
          # The tag is the first word after "release:", so "release: v0.5.0 AI reading" tags v0.5.0.
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { (($env:MSG -split "`n")[0].Substring(8).Trim() -split '\s+')[0] }
          $setup = "GigEyes-Setup-$tag.exe"
          Copy-Item dist/GigEyes-Setup.exe $setup
          gh release create $tag $setup `
            --target $env:GITHUB_SHA --prerelease --title "GigEyes $tag (pre-alpha)" `
            --notes-file .github/release-notes.md
        env:
          INPUT_TAG: ${{ inputs.release }}
          MSG: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
