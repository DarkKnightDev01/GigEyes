name: Windows build

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v6
        with:
          name: gigeyes-windows
          path: |
            target/release/gigeyes.exe
            target/release/gp-probe.exe
      # Publishing a release on GitHub attaches the exes to it.
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" target/release/gigeyes.exe target/release/gp-probe.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
